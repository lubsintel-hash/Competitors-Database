<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Competitors' Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16213a; --ink-2:#48536b; --muted:#77829a; --paper:#eff2f7; --card:#ffffff;
  --line:#dde2eb; --amber:#e0780f; --amber-soft:#fdeedd; --danger:#b3261e; --ok:#1f7a4d;
  --side:#0b1526; --side-2:#132039; --side-ink:#dfe6f2; --side-muted:#7d8aa5;
  --grad:linear-gradient(90deg,#f7931e,#e8364f);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#e8edf6;--ink-2:#aeb8cc;--muted:#7f8aa3;--paper:#0d1829;--card:#15223a;--line:#24344f;--amber:#f7931e;--amber-soft:#3a2a14;--danger:#f2837a;--ok:#4fd08f;color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#e8edf6;--ink-2:#aeb8cc;--muted:#7f8aa3;--paper:#0d1829;--card:#15223a;--line:#24344f;--amber:#f7931e;--amber-soft:#3a2a14;--danger:#f2837a;--ok:#4fd08f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* Shell (matches SCC Team Portal) */
.app{display:flex;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex}
.brand{padding:18px 18px 16px;font-size:15px;font-weight:800;letter-spacing:-.01em}
.brand b{color:#f7931e;font-weight:800}
.side nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px;overflow:auto;flex:1}
.side nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--side-muted);padding:10px 12px;border-radius:10px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.side nav button svg{width:17px;height:17px;flex:none}
.side nav button:hover{background:var(--side-2);color:var(--side-ink)}
.side nav button[aria-selected="true"]{background:var(--side-2);color:#fff}
.side nav button.home{background:var(--grad);color:#fff;text-transform:none;letter-spacing:0;font-size:14px;margin-bottom:10px;box-shadow:0 6px 18px rgba(232,54,79,.28)}
.side nav button.home[aria-selected="true"]{box-shadow:0 0 0 2px rgba(255,255,255,.35),0 6px 18px rgba(232,54,79,.28)}
.side nav .count{margin-left:auto;font-size:11px;letter-spacing:0;background:var(--side-2);color:var(--side-ink);border-radius:999px;padding:1px 8px}
.side nav button[aria-selected="true"] .count{background:#0b1526}
.sidefoot{border-top:1px solid var(--side-2);padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.sidefoot .sbtn{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-ink);padding:7px 2px;font-size:13.5px}
.sidefoot .sbtn svg{width:17px;height:17px}
.sidefoot a.sbtn{text-decoration:none}
.sidefoot small{color:var(--side-muted);font-size:11px}
.main{flex:1;min-width:0}
.wrap{padding:20px 24px 48px;max-width:1180px}

.hero{position:relative;border-radius:16px;overflow:hidden;color:#eef3fb;padding:40px 20px 44px;background:radial-gradient(ellipse 60% 45% at 50% 0%,rgba(247,120,30,.6),transparent 70%),radial-gradient(ellipse 90% 60% at 50% 55%,rgba(28,78,160,.45),transparent 75%),#0a1730}
.hero h2{text-align:center;margin:6px 0 6px;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:.01em;color:#fff}
.hero p.lead{text-align:center;margin:0 auto;max-width:560px;color:#c7d1e3;font-size:14.5px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;max-width:760px;margin:44px auto 0}
.mod{--c:#3b82f6;position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:rgba(28,45,78,.62);color:#eef3fb;border-radius:12px;padding:14px 14px 13px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,background .15s}
.mod:hover{transform:translateY(-2px);background:rgba(34,55,94,.8)}
.mod .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.mod .ic svg{width:19px;height:19px}
.mod .open{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff)}
.mod h3{margin:4px 0 0;font-size:15px}
.mod p{margin:0;font-size:13px;color:#b8c3d8;line-height:1.45}
.mod .live-count{font-size:12.5px;font-weight:700;color:color-mix(in srgb,var(--c) 55%,#fff)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips span{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#d6deec}
@media (prefers-reduced-motion:reduce){.mod{transition:none}.mod:hover{transform:none}}

.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.tabs .n{font-size:11.5px;background:var(--line);border-radius:999px;padding:1px 8px;margin-left:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card + .card{margin-top:14px}
.card h2{margin:0 0 4px;font-size:17px;font-weight:800}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.07);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:100%;min-height:42px;font-size:15px}
.field textarea{min-height:76px;resize:vertical}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.batch{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,260px));gap:10px;margin-top:14px}
.shoot{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:14px}
.shoot-main{display:flex;align-items:center;gap:16px;border:2px dashed color-mix(in srgb,var(--amber) 70%,transparent);background:var(--amber-soft);border-radius:12px;padding:20px;cursor:pointer;color:var(--ink)}
.shoot-main svg{flex:none;color:var(--amber)}
.shoot-main b{display:block;font-size:17px;font-weight:800}
.shoot-main small{font-size:13px;color:var(--ink-2)}
.shoot-alt{display:flex;align-items:center}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumb{position:relative;width:92px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:26px;padding:0}
.status{margin-top:10px;font-size:13.5px;color:var(--muted);min-height:20px}
.status.err{color:var(--danger)}

.erows{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.ehead,.erow{display:grid;gap:8px;align-items:center}
.ehead{font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0 2px}
.erow .inp{min-height:38px;padding:7px 9px;font-size:14px}
.erow .x{width:38px;height:38px;border:0;background:none;color:var(--danger);font-size:20px;border-radius:8px}
.erow .x:hover{background:var(--paper)}
.erows.cards .ehead{display:none}
.erows.cards .erow{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))!important;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.erows.cards .erow .inp{background:var(--card)}
.erows.cards .erow .wide{grid-column:1/-1}
.erows.cards .erow label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--ink-2)}
.erows.cards .erow .x{justify-self:end;grid-column:-2/-1}
@media (max-width:760px){
  .erows.rows .ehead{display:none}
  .erows.rows .erow{grid-template-columns:1fr 1fr!important;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper)}
  .erows.rows .erow .wide{grid-column:1/-1;order:-1}
  .erows.rows .erow .x{grid-column:2;justify-self:end}
  .shoot{grid-template-columns:1fr}
}

.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:14px}
@media (max-width:760px){.mgrid{grid-template-columns:1fr 1fr}.mgrid > *{grid-column:span 1!important}.mgrid > .wide{grid-column:1/-1!important}}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.search,.filter{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:40px}
.search{flex:1 1 240px}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:32px}
.chk input{width:17px;height:17px;accent-color:var(--amber);margin:0}
.twrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px}
.dtable{width:100%;border-collapse:collapse;min-width:820px}
.dtable th{background:var(--paper);text-align:left;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtable td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.dtable tr:last-child td{border-bottom:0}
.dtable tbody tr:hover td{background:color-mix(in srgb,var(--paper) 70%,transparent)}
.dtable td.num,.dtable th.num{text-align:right;white-space:nowrap}
.dtable .clip{max-width:280px;color:var(--ink-2)}
.dtable .sdot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block;margin-top:5px}
.dtable .sdot.in{background:var(--ok)}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.legend i.in{background:var(--ok)}
.banner{margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--ok) 14%,var(--card));display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 260px;font-size:14px}
.copybox{width:100%;min-height:110px;margin-top:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* Summary */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:12px 0 4px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.card h3{margin:18px 0 0;font-size:14.5px;font-weight:800}
.card .twrap .dtable{min-width:640px}
.scroll{max-height:420px;overflow:auto}
.scroll thead th{position:sticky;top:0;z-index:1}
.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar{display:grid;grid-template-columns:140px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.bar .track{height:10px;border-radius:5px;background:var(--paper);overflow:hidden;border:1px solid var(--line)}
.bar .track i{display:block;height:100%;background:var(--grad)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--ok);font-weight:700}
/* Photos */
.phbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.phbox .thumb{width:84px;height:84px}
.phadd{display:flex;gap:8px;flex-wrap:wrap}
.tthumbs{display:flex;gap:4px;flex-wrap:nowrap}
.tthumbs button{padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:44px;height:44px;background:var(--paper);flex:none}
.tthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.tthumbs .more{font-size:12px;font-weight:700;color:var(--ink-2)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(6,10,20,.88);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain}
.lightbox .lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}
.lightbox .lbn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:24px}
.lightbox .prev{left:12px}.lightbox .next{right:12px}
/* Top panel */
.app{display:block}
:root{padding-top:0}
.side{position:sticky;top:0;z-index:30;width:auto;height:auto;flex-direction:row;align-items:center;gap:8px;padding:env(safe-area-inset-top,0px) 16px 0}
.brand{padding:12px 4px;white-space:nowrap}
.side nav{flex-direction:row;padding:8px;gap:4px;overflow-x:auto;flex:1}
.side nav button{white-space:nowrap;padding:8px 12px}
.sidefoot{border-top:0;padding:0;flex-direction:row;align-items:center;gap:14px;white-space:nowrap}
.wrap{margin:0 auto}
@media (max-width:760px){
  .side{flex-wrap:wrap;padding-left:10px;padding-right:10px;gap:0}
  .brand{font-size:13px;padding:10px 4px 0;flex:1}
  .sidefoot small{display:none}
  .sidefoot{padding-top:6px}
  .side nav{order:3;flex:1 1 100%;padding:6px 0 8px}
  .side nav button{font-size:11.5px;padding:8px 10px}
  .wrap{padding:16px 14px 40px}
}
/* ===== Layout system: laptop / tablet / mobile ===== */
:root{--pad:24px;--maxw:1180px}
@media (max-width:1024px){:root{--pad:20px}}
@media (max-width:600px){:root{--pad:14px}}
.wrap{max-width:var(--maxw);margin:0 auto;padding:24px var(--pad) 56px}
.side{padding-left:max(var(--pad),calc((100% - var(--maxw))/2 + var(--pad)));padding-right:max(var(--pad),calc((100% - var(--maxw))/2 + var(--pad)));gap:16px}
.side .brand{padding:14px 0}
.side nav{padding:8px 0}
.pagehead{margin-bottom:4px;align-items:center}
.side .sidefoot small{display:none}
.side nav{flex:0 1 auto;margin-right:auto}
.side nav button{letter-spacing:.04em}
.sub{margin:4px 0 16px}
.card{padding:20px}
.card + .card{margin-top:16px}
.card > .hint{margin-bottom:2px}
.field input,.field select,.inp,.search,.filter{height:42px;min-height:42px;line-height:1.2}
.field input[type=date]{padding-top:0;padding-bottom:0}
.field textarea{height:auto;min-height:84px}
.status:empty{display:none}
.row{margin-top:16px}

/* Form grid */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 14px;margin-top:16px}
.fgrid > *{grid-column:span var(--s,1);min-width:0}
.batch{margin-top:16px}

/* Capture tiles */
.shoot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.shoot .shoot-main{grid-column:span 2;min-height:96px;padding:18px 20px}
.shoot .shoot-main.alt{border-color:var(--line);background:var(--paper)}
.shoot .shoot-main.alt svg{color:var(--ink-2)}
.thumbs:empty{display:none}

/* Records toolbar */
.tools{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;margin-top:16px}
.tools .search{width:100%}
.rbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-top:12px}
.chks{display:flex;flex-wrap:wrap;gap:6px 20px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.twrap{margin-top:16px}
.dtable td{vertical-align:middle}
.dtable .clip{color:var(--ink)}
.dtable td.c-act{white-space:nowrap;text-align:right}
.dtable td.c-dot{width:28px}
.dtable td.c-rec{min-width:160px;font-size:13.5px}
.dtable td.c-rec b{display:block;font-weight:700}
.dtable td.c-rec small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.legend{margin-top:12px}

/* Summary */
.stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0 4px}
.stat{min-width:0}
.stat b{font-size:20px}
.card h3{margin:20px 0 0}
.bars{margin-top:10px}

/* Tablet */
@media (max-width:1024px){
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid > *{grid-column:span var(--t,1)}
  .shoot{grid-template-columns:1fr 1fr}
  .shoot .shoot-main{grid-column:span 1}
  .side nav button{padding:8px 10px;letter-spacing:.03em}
  .side .sidefoot small{display:none}
  .dtable th,.dtable td{padding:9px 10px;font-size:13.5px}
  .card .twrap .dtable{min-width:0}
}
@media (max-width:860px){
  /* Tables become stacked cards */
  .twrap:has(.stack){overflow:visible;background:none;border:0;border-radius:0}
  .dtable.stack,.dtable.stack tbody{display:block;min-width:0!important;width:100%}
  .dtable.stack thead{display:none}
  .dtable.stack tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .card .dtable.stack tr{background:var(--paper)}
  .dtable.stack td{display:block;padding:0;border:0;text-align:left!important;white-space:normal!important;font-size:14px;min-width:0;overflow-wrap:anywhere}
  .dtable.stack td::before{content:attr(data-label);display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:1px}
  .dtable.stack td.c-wide,.dtable.stack td.clip{grid-column:span 2}

async function api(action,data,signal){
  const t=new AbortController(), limit=(action==="read"||action==="upload")?120000:45000;
  let timedOut=false; const timer=setTimeout(()=>{ timedOut=true; t.abort(); },limit);
  if(signal) signal.addEventListener("abort",()=>t.abort());
  try{ return await apiCall(action,data,t.signal); }
  catch(e){ if(timedOut) throw Object.assign(new Error("The database took too long to reply. Check the connection and try again."),{code:"timeout"}); throw e; }
  finally{ clearTimeout(timer); }
}
async function apiCall(action,data,signal){
  if(!configured) throw Object.assign(new Error("This page isn’t connected yet. The organizer needs to add the web app link."),{code:"not_configured"});
  let r;
  try{ r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,code:getCode(),...(data||{})}),signal}); }
  catch(e){ if(e&&e.name==="AbortError") throw Object.assign(new Error("Stopped."),{code:"cancelled"}); throw Object.assign(new Error("Couldn’t reach the database. Check the internet connection and try again."),{code:"network"}); }
  let j; try{ j=await r.json(); }catch(e){ throw Object.assign(new Error("The database sent an unexpected reply. Check that the web app is deployed with access set to “Anyone”."),{code:"bad_reply"}); }
  if(!j.ok) throw Object.assign(new Error(j.error||"The request wasn’t accepted."),{code:j.code||"error"});
  return j;
}

const OCR_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrLib=null;
function loadOCR(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(ocrLib) return ocrLib;
  ocrLib=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=OCR_SRC; sc.onload=()=>res(window.Tesseract); sc.onerror=()=>{ ocrLib=null; sc.remove(); rej(new Error("The price reader couldn’t load. Check the internet connection and try again.")); }; document.head.append(sc); });
  return ocrLib;
}
async function prepForOCR(blob){
  const url=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const long=Math.max(img.naturalWidth,img.naturalHeight), sc=Math.min(2.5,Math.max(1,2400/long));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  const g=c.getContext("2d"); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  const d=g.getImageData(0,0,c.width,c.height), px=d.data;
  for(let k=0;k<px.length;k+=4){ let y=0.299*px[k]+0.587*px[k+1]+0.114*px[k+2]; y=Math.max(0,Math.min(255,(y-128)*1.5+128)); px[k]=px[k+1]=px[k+2]=y; }
  g.putImageData(d,0,0);
  return c;
}
function parsePricelist(text,brands){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.replace(/[|_]+/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const all=text.toUpperCase();
  const hasSrp=/\b(SRP|RRP|RETAIL|SUGGESTED)\b/.test(all), hasTrade=/\b(DEALER|DEALERS|TRADE|NET|WHOLESALE|DISTRIBUTOR|DP|WSP)\b/.test(all);
  const findBrand=s=>{ const u=s.toUpperCase(); let best=""; brands.forEach(b=>{ if(new RegExp("(^|[^A-Z])"+b.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^A-Z]|$)").test(u)&&b.length>best.length) best=b; }); return best; };
  let curBrand=findBrand(lines.slice(0,6).join(" "))||"", curVisc="", rows=[];
  const viscRe=/\b(\d{1,2})\s?W\s?[-–]?\s?(\d{2,3})\b|\bSAE\s?(\d{2,3})\b|\bNLGI\s?#?\s?(\d)\b/i;
  const packRe=/\b(\d+(?:[.,]\d+)?)\s?(L|LT|LTR|LTRS|LITERS?|LITRES?|ML|G|GMS?|KG|KGS)\b/i;
  const normVisc=m=>m[1]?m[1]+"W-"+m[2]:m[3]?"SAE "+m[3]:"NLGI "+m[4];
  const normPack=m=>{ let n=parseFloat(m[1].replace(",",".")), u=m[2].toUpperCase(); if(u==="ML") return (n>=100?String(+(n/1000).toFixed(2)):String(n))+(n>=100?"L":"ml"); if(/^L/.test(u)) return n+"L"; if(/^K/.test(u)) return n+"kg"; return n+"g"; };
  for(const raw of lines){
    if(/\b(TOTAL|SUBTOTAL|PAGE|TEL|TELEPHONE|EMAIL|ADDRESS|EFFECTIVE|VALID|PRICE ?LIST|PRICELIST|DATE)\b/i.test(raw)) continue;
    let s=raw;
    const b=findBrand(s); if(b) curBrand=b;
    const vm=s.match(viscRe); const visc=vm?normVisc(vm):"";
    if(vm) s=s.replace(vm[0]," ");
    const pm=s.match(packRe); const pack=pm?normPack(pm):"";
    if(pm) s=s.replace(pm[0]," ");
    const nums=[...s.matchAll(/(?:₱|PHP|P)?\s?(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{2}|\d{2,6})(?![\d%])/gi)].map(m=>({v:parseFloat(m[1].replace(/,/g,"")),i:m.index})).filter(x=>x.v>=20&&x.v<=200000);
    if(!nums.length){ if(visc&&raw.length<40) curVisc=visc; continue; }
    let name=s.slice(0,nums[0].i).replace(/(?:₱|PHP)\s*$/i,"");
    if(b) name=name.replace(new RegExp(b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i")," ");
    name=name.replace(/[^A-Za-z0-9+\-./&' ]+/g," ").replace(/\s+/g," ").trim().replace(/^[-.\s]+|[-.\s]+$/g,"");
    if(name.length<2&&!visc) continue;
    const vals=nums.map(x=>x.v); let trade=null,srp=null;
    if(vals.length>=2){ const pair=vals.slice(-2); trade=Math.min(...pair); srp=Math.max(...pair); }
    else if(hasTrade&&!hasSrp) trade=vals[0]; else srp=vals[0];
    rows.push({brand:curBrand,product:name,viscosity:visc||curVisc,packsize:pack,trade,srp});
  }
  return rows;
}

async function toJpeg(file,max=2400,q=0.9){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",q));
  }catch(e){ return file; }
}

/* ---------- Frozen header row + first 3 columns ---------- */
function freezeCols(tbl,n=3){
  const apply=()=>{
    const head=tbl.tHead&&tbl.tHead.rows[0]; if(!head) return;
    let left=0;
    for(let c=0;c<n&&c<head.cells.length;c++){
      const w=head.cells[c].getBoundingClientRect().width;
      tbl.querySelectorAll("tr > :nth-child("+(c+1)+")").forEach(cell=>{ if(cell.colSpan>1) return; cell.style.left=left+"px"; cell.classList.add("frz"); cell.classList.toggle("frz-last",c===n-1); });
      left+=w;
    }
  };
  tbl._freeze=()=>requestAnimationFrame(apply);
  if(window.ResizeObserver) new ResizeObserver(()=>apply()).observe(tbl);
  tbl._freeze();
}

  const visc=r=>{ if(r.viscosity) return r.viscosity; const m=String(r.product||"").toUpperCase().match(/\b\d{1,2}W-?\d{2,3}\b|\bSAE ?\d{2,3}\b|\bNLGI ?\d\b/); return m?m[0].replace(/^(\d{1,2}W)(\d)/,"$1-$2").replace(/^(SAE|NLGI)(\d)/,"$1 $2"):""; };

  P.forEach(r=>{ const v=visc(r)||"—"; const k=(r.brand||"—")+"|"+v+"|"+(r.packsize||"—"); (groups[k]=groups[k]||{brand:r.brand||"—",visc:v,pack:r.packsize||"—",sku:new Set(),t:[],s:[],m:[]}); const g=groups[k]; g.sku.add((r.product||"").toLowerCase()); if(r.trade!=null) g.t.push(r.trade); if(r.srp!=null) g.s.push(r.srp); if(r.trade!=null&&r.srp) g.m.push((r.srp-r.trade)/r.srp*100); });
  const grows=Object.values(groups).sort((a,b)=>a.brand.localeCompare(b.brand)||a.visc.localeCompare(b.visc,undefined,{numeric:true})||a.pack.localeCompare(b.pack,undefined,{numeric:true})).map(g=>{ const m=avg(g.m); return [g.brand,g.visc,g.pack,peso(avg(g.t)),peso(avg(g.s)),m==null?"":el("span",{class:"pos",text:m.toFixed(1)+"%"})]; });
  const latest={};
  P.forEach(r=>{ const k=[r.brand,r.product,visc(r),r.packsize].join("|").toLowerCase(); const c=latest[k]; if(!c||(r.date||"")>(c.date||"")||((r.date||"")===(c.date||"")&&r.createdAt>c.createdAt)) latest[k]=r; });
  const lrows=Object.values(latest).sort((a,b)=>(a.brand||"").localeCompare(b.brand||"")||(a.product||"").localeCompare(b.product||"")||(a.packsize||"").localeCompare(b.packsize||"",undefined,{numeric:true})).map(r=>[r.brand,r.product,visc(r),r.packsize,peso(r.trade),peso(r.srp),r.location||"",fmtDate(r.date)]);
  sBody.append(el("div",{class:"card"},
    el("h2",{text:"Price Survey"}),
    el("div",{class:"stats"},
      el("div",{class:"stat"},el("b",{text:String(P.length)}),el("span",{text:"Price records"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(P.map(r=>r.brand)).length)}),el("span",{text:"Brands surveyed"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(P.map(r=>(r.location||"").toLowerCase())).length)}),el("span",{text:"Provinces visited"})),
      el("div",{class:"stat"},el("b",{text:fmtDate(last(P))}),el("span",{text:"Latest survey"}))),
    el("h3",{text:"Prices by brand, viscosity and packsize"}),
    table(["Brand","Viscosity","Packsize","Avg trade price","Avg SRP/RRP","Margin %"],grows,[3,4,5]),
    el("p",{class:"hint",style:"margin-top:6px",text:"Margin is (SRP/RRP − trade price) ÷ SRP/RRP, for records that have both prices."}),
    el("h3",{text:"Latest price per product"}),
    table(["Brand","Product name","Viscosity","Packsize","Trade price","SRP/RRP","Province","Date"],lrows,[4,5],true)));

  // Programs card
  const byBrand={}; G.forEach(r=>{ const b=r.brand||"—"; byBrand[b]=(byBrand[b]||0)+1; });
  const bmax=Math.max(1,...Object.values(byBrand));
  const bars=el("div",{class:"bars"},Object.entries(byBrand).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([b,n])=>{ const i=el("i"); i.style.width=(n/bmax*100)+"%"; return el("div",{class:"bar"},el("span",{text:b}),el("span",{class:"track"},i),el("b",{text:String(n)})); }));
  const prows=G.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.createdAt-a.createdAt).map(r=>[fmtDate(r.date),r.brand,r.area,r.program,r.mechanics,r.rewards]);
  sBody.append(el("div",{class:"card"},
    el("h2",{text:"Programs"}),
    el("div",{class:"stats"},
      el("div",{class:"stat"},el("b",{text:String(G.length)}),el("span",{text:"Programs recorded"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(G.map(r=>r.brand)).length)}),el("span",{text:"Brands with programs"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(G.map(r=>(r.area||"").toLowerCase())).length)}),el("span",{text:"Provinces covered"})),
      el("div",{class:"stat"},el("b",{text:fmtDate(last(G))}),el("span",{text:"Latest program recorded"}))),
    el("h3",{text:"Programs by brand"}),
    G.length?bars:el("p",{class:"hint",style:"margin-top:8px",text:"No programs for this selection."}),
    el("h3",{text:"Program list"}),
    table(["Date","Brand","Province","Program name","Mechanics","Rewards"],prows,[],true)));

  // Merchandising card
  const M=allM.filter(r=>inPeriod(r.date)&&bf(r));
  const barList=obj=>{ const mx=Math.max(1,...Object.values(obj)); return el("div",{class:"bars"},Object.entries(obj).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([k,n])=>{ const i=el("i"); i.style.width=(n/mx*100)+"%"; return el("div",{class:"bar"},el("span",{text:k}),el("span",{class:"track"},i),el("b",{text:String(n)})); })); };
  const mBrand={}, mType={};
  M.forEach(r=>{ const b=r.brand||"—"; mBrand[b]=(mBrand[b]||0)+1;
    String(r.items||"").split(/,|;|\/| and /i).map(x=>x.trim()).filter(Boolean).forEach(x=>{ const k=x.charAt(0).toUpperCase()+x.slice(1).toLowerCase(); mType[k]=(mType[k]||0)+1; }); });
  const mrows=M.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||b.createdAt-a.createdAt).map(r=>[fmtDate(r.date),r.brand,r.area,r.items,(r.photos&&r.photos.length)?thumbsCell(r.photos):""]);
  const none=t=>el("p",{class:"hint",style:"margin-top:8px",text:t});
  sBody.append(el("div",{class:"card"},
    el("h2",{text:"Merchandising"}),
    el("div",{class:"stats"},
      el("div",{class:"stat"},el("b",{text:String(M.length)}),el("span",{text:"Merchandising records"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(M.map(r=>r.brand)).length)}),el("span",{text:"Brands with merchandising"})),
      el("div",{class:"stat"},el("b",{text:String(uniq(M.map(r=>(r.area||"").toLowerCase())).length)}),el("span",{text:"Provinces covered"})),
      el("div",{class:"stat"},el("b",{text:fmtDate(last(M))}),el("span",{text:"Latest record"}))),
    el("h3",{text:"Merchandising by brand"}),
    M.length?barList(mBrand):none("No merchandising for this selection."),
    el("h3",{text:"Merchandising by item type"}),
    M.length?barList(mType):none("No merchandising for this selection."),
    el("h3",{text:"Merchandising list"}),
    table(["Date","Brand","Province","Merchandising items","Photos"],mrows,[],true)));
}
renderSummary();

buildModule(MODULES.price);
buildModule(MODULES.programs);
buildModule(MODULES.merch);
$("appVer").textContent="Competitors’ Database "+APP_VERSION;
initBackend();
})();
</script>
</body>
</html>
